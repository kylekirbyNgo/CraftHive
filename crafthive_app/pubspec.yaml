name: crafthive
description: CraftHive – an all-in-one Android marketplace for handmade and custom-made products.
publish_to: "none"
version: 0.3.0+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  flutter_svg: ^2.0.10
  google_fonts: ^6.2.1
  supabase_flutter: ^2.8.0
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  crypto: ^3.0.3
  # Shrinks receipt screenshots under the OCR service's 1 MB limit
  image: ^4.5.0
  # Firebase: chat, online status, notifications and push (see FIREBASE_SETUP.md)
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_database: ^13.0.1
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
